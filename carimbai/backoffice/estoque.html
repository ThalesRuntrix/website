<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estoque | Carimbai</title>

   <link rel="stylesheet" href="style.css">

</head>

<body>

    <div>

        <h2>Acesso ao Backoffice</h2>

            <form id="form-login">

                <label for="senha-backoffice">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha-backoffice"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <div id="login-erro"></div>

            </form>

    </div>

<div class="layout" id="backoffice" style="display:none;">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar">

    <div class="logo">
      Carimbai
    </div>

    <nav class="menu">

      <a href="/backoffice/index.html">
        Dashboard
      </a>

      <a href="/backoffice/pedidos.html">
        Pedidos
      </a>

      <a href="/backoffice/produtos.html">
        Produtos
      </a>

      <a href="/backoffice/estoque.html" class="active">
        Estoque
      </a>

    </nav>

  </aside>


  <!-- =========================
       CONTEÚDO
  ========================== -->

  <main class="content">

    <header class="page-header">

      <div>
        <h1>Estoque</h1>

        <p>
          Controle de estoque dos produtos e variações.
        </p>
      </div>

      <button
        class="btn btn-secondary"
        id="btnAtualizar"
      >
        Atualizar
      </button>

    </header>


    <!-- =========================
         RESUMO
    ========================== -->

    <section class="summary">

      <div class="summary-card">
        <div class="summary-label">
          SKUs
        </div>

        <div
          class="summary-value"
          id="totalSkus"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Com estoque
        </div>

        <div
          class="summary-value"
          id="skusComEstoque"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Sem estoque
        </div>

        <div
          class="summary-value"
          id="skusSemEstoque"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Estoque baixo
        </div>

        <div
          class="summary-value"
          id="skusEstoqueBaixo"
        >
          0
        </div>
      </div>

    </section>


    <!-- =========================
         FILTROS
    ========================== -->

    <section class="filters">

      <div class="filters-row">

        <div class="search-wrapper">

          <input
            type="text"
            id="busca"
            placeholder="Pesquisar produto, SKU ou cor..."
          >

        </div>

        <select id="filtroStatus">

          <option value="todos">
            Todos
          </option>

          <option value="estoque">
            Com estoque
          </option>

          <option value="zero">
            Sem estoque
          </option>

          <option value="baixo">
            Estoque baixo
          </option>

          <option value="inativo">
            Inativos
          </option>

        </select>

      </div>

    </section>


    <!-- =========================
         TABELA
    ========================== -->

    <section class="table-card">

      <div id="estadoTabela" class="state">
        Carregando estoque...
      </div>

      <div
        class="table-wrapper"
        id="tableWrapper"
        style="display:none;"
      >

        <table>

          <thead>
            <tr>

              <th>
                Produto
              </th>

              <th>
                SKU
              </th>

              <th>
                Cor
              </th>

              <th>
                Estoque
              </th>

              <th>
                Status
              </th>

              <th>
                Ações
              </th>

            </tr>
          </thead>

          <tbody id="estoqueBody"></tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<!-- =========================
     MODAL MOVIMENTAÇÃO
========================== -->

<div
  class="modal-backdrop"
  id="modalMovimentacao"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <h2>
          Registrar movimentação
        </h2>

        <p id="modalSkuNome"></p>

      </div>

      <button
        class="close-btn"
        id="btnFecharModal"
      >
        ×
      </button>

    </div>


    <div class="stock-current">

      Estoque atual

      <br>

      <span id="modalEstoqueAtual">
        0
      </span>

    </div>


    <div class="form-group">

      <label for="tipoMovimentacao">
        Tipo
      </label>

      <select id="tipoMovimentacao">

        <option value="entrada">
          Entrada
        </option>

        <option value="saida">
          Saída
        </option>

        <option value="ajuste">
          Ajuste
        </option>

      </select>

    </div>


    <div
      class="form-group"
      id="grupoQuantidade"
    >

      <label for="quantidade">
        Quantidade
      </label>

      <input
        type="number"
        id="quantidade"
        min="1"
        step="1"
        placeholder="Ex.: 10"
      >

    </div>


    <div
      class="form-group"
      id="grupoEstoqueFinal"
      style="display:none;"
    >

      <label for="estoqueFinal">
        Estoque final
      </label>

      <input
        type="number"
        id="estoqueFinal"
        min="0"
        step="1"
        placeholder="Ex.: 8"
      >

    </div>


    <div class="form-group">

      <label for="motivo">
        Motivo
      </label>

      <input
        type="text"
        id="motivo"
        placeholder="Ex.: Compra fornecedor"
      >

    </div>


    <div class="form-group">

      <label for="observacao">
        Observação
      </label>

      <textarea
        id="observacao"
        placeholder="Observações opcionais..."
      ></textarea>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        id="btnCancelar"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary"
        id="btnSalvarMovimentacao"
      >
        Registrar
      </button>

    </div>

  </div>

</div>


<!-- =========================
     MODAL HISTÓRICO
========================== -->

<div
  class="modal-backdrop"
  id="modalHistorico"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <h2>
          Histórico
        </h2>

        <p id="historicoSkuNome"></p>

      </div>

      <button
        class="close-btn"
        id="btnFecharHistorico"
      >
        ×
      </button>

    </div>

    <div id="historicoConteudo">

      Carregando...

    </div>

  </div>

</div>
    <script src="script.js"></script>
</body>
</html>
