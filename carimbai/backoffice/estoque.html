<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estoque | Carimbai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #1f2937;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LAYOUT
    ========================= */

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #111827;
      color: #fff;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu a {
      color: #d1d5db;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 7px;
      display: block;
    }

    .menu a:hover,
    .menu a.active {
      background: #374151;
      color: #fff;
    }

    .content {
      flex: 1;
      padding: 28px;
      min-width: 0;
    }

    /* =========================
       HEADER
    ========================= */

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      color: #6b7280;
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: #111827;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    /* =========================
       CARDS
    ========================= */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
    }

    .summary-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .filters-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      flex: 1;
      min-width: 240px;
    }

    .search-wrapper input {
      width: 100%;
    }

    input,
    select,
    textarea {
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #fff;
      color: #111827;
      padding: 10px 11px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6b7280;
    }

    /* =========================
       TABLE
    ========================= */

    .table-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid #eef0f2;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #fafafa;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .sku {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
    }

    .stock {
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-ok {
      background: #dcfce7;
      color: #166534;
    }

    .status-low {
      background: #fef3c7;
      color: #92400e;
    }

    .status-zero {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-off {
      background: #e5e7eb;
      color: #4b5563;
    }

    .actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 21px;
    }

    .modal-header p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .stock-current {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .stock-current span {
      font-size: 24px;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* =========================
       HISTÓRICO
    ========================= */

    .history {
      margin-top: 22px;
    }

    .history h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .history-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .history-type {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
    }

    .history-type.entrada {
      color: #15803d;
    }

    .history-type.saida {
      color: #b91c1c;
    }

    .history-type.ajuste {
      color: #92400e;
    }

    .history-meta {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .state {
      padding: 35px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .content {
        padding: 18px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar">

    <div class="logo">
      Carimbai
    </div>

    <nav class="menu">

      <a href="/backoffice/index.html">
        Dashboard
      </a>

      <a href="/backoffice/pedidos.html">
        Pedidos
      </a>

      <a href="/backoffice/produtos.html">
        Produtos
      </a>

      <a href="/backoffice/estoque.html" class="active">
        Estoque
      </a>

    </nav>

  </aside>


  <!-- =========================
       CONTEÚDO
  ========================== -->

  <main class="content">

    <header class="page-header">

      <div>
        <h1>Estoque</h1>

        <p>
          Controle de estoque dos produtos e variações.
        </p>
      </div>

      <button
        class="btn btn-secondary"
        id="btnAtualizar"
      >
        Atualizar
      </button>

    </header>


    <!-- =========================
         RESUMO
    ========================== -->

    <section class="summary">

      <div class="summary-card">
        <div class="summary-label">
          SKUs
        </div>

        <div
          class="summary-value"
          id="totalSkus"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Com estoque
        </div>

        <div
          class="summary-value"
          id="skusComEstoque"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Sem estoque
        </div>

        <div
          class="summary-value"
          id="skusSemEstoque"
        >
          0
        </div>
      </div>


      <div class="summary-card">
        <div class="summary-label">
          Estoque baixo
        </div>

        <div
          class="summary-value"
          id="skusEstoqueBaixo"
        >
          0
        </div>
      </div>

    </section>


    <!-- =========================
         FILTROS
    ========================== -->

    <section class="filters">

      <div class="filters-row">

        <div class="search-wrapper">

          <input
            type="text"
            id="busca"
            placeholder="Pesquisar produto, SKU ou cor..."
          >

        </div>

        <select id="filtroStatus">

          <option value="todos">
            Todos
          </option>

          <option value="estoque">
            Com estoque
          </option>

          <option value="zero">
            Sem estoque
          </option>

          <option value="baixo">
            Estoque baixo
          </option>

          <option value="inativo">
            Inativos
          </option>

        </select>

      </div>

    </section>


    <!-- =========================
         TABELA
    ========================== -->

    <section class="table-card">

      <div id="estadoTabela" class="state">
        Carregando estoque...
      </div>

      <div
        class="table-wrapper"
        id="tableWrapper"
        style="display:none;"
      >

        <table>

          <thead>
            <tr>

              <th>
                Produto
              </th>

              <th>
                SKU
              </th>

              <th>
                Cor
              </th>

              <th>
                Estoque
              </th>

              <th>
                Status
              </th>

              <th>
                Ações
              </th>

            </tr>
          </thead>

          <tbody id="estoqueBody"></tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<!-- =========================
     MODAL MOVIMENTAÇÃO
========================== -->

<div
  class="modal-backdrop"
  id="modalMovimentacao"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <h2>
          Registrar movimentação
        </h2>

        <p id="modalSkuNome"></p>

      </div>

      <button
        class="close-btn"
        id="btnFecharModal"
      >
        ×
      </button>

    </div>


    <div class="stock-current">

      Estoque atual

      <br>

      <span id="modalEstoqueAtual">
        0
      </span>

    </div>


    <div class="form-group">

      <label for="tipoMovimentacao">
        Tipo
      </label>

      <select id="tipoMovimentacao">

        <option value="entrada">
          Entrada
        </option>

        <option value="saida">
          Saída
        </option>

        <option value="ajuste">
          Ajuste
        </option>

      </select>

    </div>


    <div
      class="form-group"
      id="grupoQuantidade"
    >

      <label for="quantidade">
        Quantidade
      </label>

      <input
        type="number"
        id="quantidade"
        min="1"
        step="1"
        placeholder="Ex.: 10"
      >

    </div>


    <div
      class="form-group"
      id="grupoEstoqueFinal"
      style="display:none;"
    >

      <label for="estoqueFinal">
        Estoque final
      </label>

      <input
        type="number"
        id="estoqueFinal"
        min="0"
        step="1"
        placeholder="Ex.: 8"
      >

    </div>


    <div class="form-group">

      <label for="motivo">
        Motivo
      </label>

      <input
        type="text"
        id="motivo"
        placeholder="Ex.: Compra fornecedor"
      >

    </div>


    <div class="form-group">

      <label for="observacao">
        Observação
      </label>

      <textarea
        id="observacao"
        placeholder="Observações opcionais..."
      ></textarea>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        id="btnCancelar"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary"
        id="btnSalvarMovimentacao"
      >
        Registrar
      </button>

    </div>

  </div>

</div>


<!-- =========================
     MODAL HISTÓRICO
========================== -->

<div
  class="modal-backdrop"
  id="modalHistorico"
>

  <div class="modal">

    <div class="modal-header">

      <div>

        <h2>
          Histórico
        </h2>

        <p id="historicoSkuNome"></p>

      </div>

      <button
        class="close-btn"
        id="btnFecharHistorico"
      >
        ×
      </button>

    </div>

    <div id="historicoConteudo">

      Carregando...

    </div>

  </div>

</div>


<script>
  const API_URL = "/api/estoque";

  let estoqueData = [];
  let skuSelecionado = null;

  const $ = (id) => document.getElementById(id);


  // =====================================================
  // CARREGAR ESTOQUE
  // =====================================================

  async function carregarEstoque() {

    $("estadoTabela").style.display = "block";
    $("estadoTabela").className = "state";
    $("estadoTabela").textContent = "Carregando estoque...";

    $("tableWrapper").style.display = "none";

    try {

      const response = await fetch(API_URL);

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data?.error || "Erro ao buscar estoque"
        );
      }

      estoqueData = Array.isArray(data)
        ? data
        : [];

      atualizarResumo();

      renderizarTabela();

    } catch (error) {

      console.error(error);

      $("estadoTabela").className =
        "state error";

      $("estadoTabela").textContent =
        error.message || "Erro ao carregar estoque";

      $("tableWrapper").style.display = "none";
    }
  }


  // =====================================================
  // RESUMO
  // =====================================================

  function atualizarResumo() {

    const total = estoqueData.length;

    const comEstoque =
      estoqueData.filter(
        item => Number(item.estoque) > 0
      ).length;

    const semEstoque =
      estoqueData.filter(
        item => Number(item.estoque) === 0
      ).length;

    const baixoEstoque =
      estoqueData.filter(
        item =>
          Number(item.estoque) > 0 &&
          Number(item.estoque_minimo) > 0 &&
          Number(item.estoque) <= Number(item.estoque_minimo)
      ).length;

    $("totalSkus").textContent = total;
    $("skusComEstoque").textContent = comEstoque;
    $("skusSemEstoque").textContent = semEstoque;
    $("skusEstoqueBaixo").textContent = baixoEstoque;
  }


  // =====================================================
  // FILTRAR
  // =====================================================

  function getDadosFiltrados() {

    const busca =
      $("busca").value
        .trim()
        .toLowerCase();

    const status =
      $("filtroStatus").value;

    return estoqueData.filter(item => {

      const textoBusca = [

        item.produto,
        item.sku,
        item.cor

      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      if (
        busca &&
        !textoBusca.includes(busca)
      ) {
        return false;
      }

      const estoque =
        Number(item.estoque);

      const minimo =
        Number(item.estoque_minimo);

      if (status === "estoque" && estoque <= 0) {
        return false;
      }

      if (status === "zero" && estoque !== 0) {
        return false;
      }

      if (
        status === "baixo" &&
        !(
          estoque > 0 &&
          minimo > 0 &&
          estoque <= minimo
        )
      ) {
        return false;
      }

      if (
        status === "inativo" &&
        item.ativo !== false
      ) {
        return false;
      }

      return true;
    });
  }


  // =====================================================
  // STATUS
  // =====================================================

  function getStatus(item) {

    if (item.ativo === false) {

      return {
        texto: "Inativo",
        classe: "status-off"
      };
    }

    const estoque =
      Number(item.estoque);

    const minimo =
      Number(item.estoque_minimo);

    if (estoque === 0) {

      return {
        texto: "Sem estoque",
        classe: "status-zero"
      };
    }

    if (
      minimo > 0 &&
      estoque <= minimo
    ) {

      return {
        texto: "Estoque baixo",
        classe: "status-low"
      };
    }

    return {
      texto: "Disponível",
      classe: "status-ok"
    };
  }


  // =====================================================
  // RENDER TABELA
  // =====================================================

  function renderizarTabela() {

    const dados =
      getDadosFiltrados();

    const body =
      $("estoqueBody");

    body.innerHTML = "";

    if (dados.length === 0) {

      $("estadoTabela").style.display =
        "block";

      $("estadoTabela").className =
        "state";

      $("estadoTabela").textContent =
        "Nenhum SKU encontrado.";

      $("tableWrapper").style.display =
        "none";

      return;
    }

    $("estadoTabela").style.display =
      "none";

    $("tableWrapper").style.display =
      "block";


    for (const item of dados) {

      const status =
        getStatus(item);

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>

          <strong>
            ${escapeHtml(item.produto || "-")}
          </strong>

        </td>

        <td>

          <strong>
            ${escapeHtml(item.sku || "-")}
          </strong>

          <div class="sku">
            ID ${item.id}
          </div>

        </td>

        <td>
          ${escapeHtml(item.cor || "-")}
        </td>

        <td>

          <div class="stock">
            ${Number(item.estoque)}
          </div>

          <div class="sku">
            Mínimo: ${Number(item.estoque_minimo)}
          </div>

        </td>

        <td>

          <span
            class="status ${status.classe}"
          >
            ${status.texto}
          </span>

        </td>

        <td>

          <div class="actions">

            <button
              class="btn btn-small btn-secondary"
              data-action="movimentar"
              data-id="${item.id}"
            >
              Movimentar
            </button>

            <button
              class="btn btn-small btn-secondary"
              data-action="historico"
              data-id="${item.id}"
            >
              Histórico
            </button>

          </div>

        </td>

      `;

      body.appendChild(tr);
    }
  }


  // =====================================================
  // EVENTOS DA TABELA
  // =====================================================

  $("estoqueBody").addEventListener(
    "click",
    async (event) => {

      const button =
        event.target.closest("button");

      if (!button) {
        return;
      }

      const id =
        Number(button.dataset.id);

      const item =
        estoqueData.find(
          x => Number(x.id) === id
        );

      if (!item) {
        return;
      }

      if (
        button.dataset.action ===
        "movimentar"
      ) {

        abrirModalMovimentacao(item);
      }

      if (
        button.dataset.action ===
        "historico"
      ) {

        await abrirHistorico(item);
      }
    }
  );


  // =====================================================
  // MODAL MOVIMENTAÇÃO
  // =====================================================

  function abrirModalMovimentacao(item) {

    skuSelecionado = item;

    $("modalSkuNome").textContent =
      `${item.produto} • ${item.sku}`;

    $("modalEstoqueAtual").textContent =
      Number(item.estoque);

    $("tipoMovimentacao").value =
      "entrada";

    $("quantidade").value =
      "";

    $("estoqueFinal").value =
      Number(item.estoque);

    $("motivo").value =
      "";

    $("observacao").value =
      "";

    atualizarCamposMovimentacao();

    $("modalMovimentacao")
      .classList.add("open");
  }


  function fecharModalMovimentacao() {

    $("modalMovimentacao")
      .classList.remove("open");

    skuSelecionado = null;
  }


  function atualizarCamposMovimentacao() {

    const tipo =
      $("tipoMovimentacao").value;

    if (tipo === "ajuste") {

      $("grupoQuantidade").style.display =
        "none";

      $("grupoEstoqueFinal").style.display =
        "block";

    } else {

      $("grupoQuantidade").style.display =
        "block";

      $("grupoEstoqueFinal").style.display =
        "none";
    }
  }


  // =====================================================
  // SALVAR MOVIMENTAÇÃO
  // =====================================================

  async function salvarMovimentacao() {

    if (!skuSelecionado) {
      return;
    }

    const tipo =
      $("tipoMovimentacao").value;

    const payload = {

      produto_sku_id:
        Number(skuSelecionado.id),

      tipo,

      motivo:
        $("motivo").value.trim() || null,

      observacao:
        $("observacao").value.trim() || null
    };


    if (
      tipo === "entrada" ||
      tipo === "saida"
    ) {

      const quantidade =
        Number($("quantidade").value);

      if (
        !Number.isInteger(quantidade) ||
        quantidade <= 0
      ) {

        alert(
          "Informe uma quantidade válida."
        );

        return;
      }

      payload.quantidade =
        quantidade;
    }


    if (tipo === "ajuste") {

      const estoqueFinal =
        Number($("estoqueFinal").value);

      if (
        !Number.isInteger(estoqueFinal) ||
        estoqueFinal < 0
      ) {

        alert(
          "Informe um estoque final válido."
        );

        return;
      }

      payload.estoque_final =
        estoqueFinal;
    }


    const button =
      $("btnSalvarMovimentacao");

    button.disabled = true;
    button.textContent =
      "Salvando...";


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          "Erro ao registrar movimentação"
        );
      }


      fecharModalMovimentacao();

      await carregarEstoque();

      alert(
        `Movimentação registrada.\n\n` +
        `Estoque: ` +
        `${data.estoque_anterior} → ` +
        `${data.estoque_posterior}`
      );


    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Erro ao registrar movimentação."
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Registrar";
    }
  }


  // =====================================================
  // HISTÓRICO
  // =====================================================

  async function abrirHistorico(item) {

    $("historicoSkuNome").textContent =
      `${item.produto} • ${item.sku}`;

    $("historicoConteudo").innerHTML =
      `<div class="state">Carregando...</div>`;

    $("modalHistorico")
      .classList.add("open");


    try {

      const response =
        await fetch(
          `${API_URL}?id=${item.id}&historico=true`
        );

      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          "Erro ao buscar histórico"
        );
      }


      if (!Array.isArray(data) ||
          data.length === 0) {

        $("historicoConteudo").innerHTML =
          `<div class="state">
             Nenhuma movimentação registrada.
           </div>`;

        return;
      }


      $("historicoConteudo").innerHTML =
        "";


      for (const mov of data) {

        const dataFormatada =
          formatarData(mov.created_at);

        const div =
          document.createElement("div");

        div.className =
          "history-item";


        const sinal =
          mov.tipo === "saida"
            ? "-"
            : mov.tipo === "entrada"
              ? "+"
              : "";


        div.innerHTML = `

          <div class="history-top">

            <div>

              <div
                class="history-type ${escapeHtml(mov.tipo)}"
              >
                ${escapeHtml(mov.tipo)}
              </div>

              <div class="history-meta">
                ${escapeHtml(
                  mov.motivo || "Sem motivo informado"
                )}
              </div>

            </div>

            <strong>
              ${sinal}${Number(mov.quantidade)}
            </strong>

          </div>

          <div class="history-meta">
            Estoque:
            ${Number(mov.estoque_anterior)}
            →
            ${Number(mov.estoque_posterior)}
          </div>

          <div class="history-meta">
            ${escapeHtml(
              dataFormatada
            )}
          </div>

          ${
            mov.pedido_codigo
              ? `
                <div class="history-meta">
                  Pedido:
                  ${escapeHtml(mov.pedido_codigo)}
                </div>
              `
              : ""
          }

          ${
            mov.observacao
              ? `
                <div class="history-meta">
                  ${escapeHtml(mov.observacao)}
                </div>
              `
              : ""
          }

        `;


        $("historicoConteudo")
          .appendChild(div);
      }


    } catch (error) {

      console.error(error);

      $("historicoConteudo").innerHTML =
        `<div class="state error">
          ${escapeHtml(
            error.message ||
            "Erro ao carregar histórico"
          )}
        </div>`;
    }
  }


  function fecharHistorico() {

    $("modalHistorico")
      .classList.remove("open");
  }


  // =====================================================
  // UTILITÁRIOS
  // =====================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function formatarData(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString(
      "pt-BR",
      {
        dateStyle: "short",
        timeStyle: "short"
      }
    );
  }


  // =====================================================
  // EVENTOS
  // =====================================================

  $("btnAtualizar")
    .addEventListener(
      "click",
      carregarEstoque
    );


  $("busca")
    .addEventListener(
      "input",
      renderizarTabela
    );


  $("filtroStatus")
    .addEventListener(
      "change",
      renderizarTabela
    );


  $("tipoMovimentacao")
    .addEventListener(
      "change",
      atualizarCamposMovimentacao
    );


  $("btnSalvarMovimentacao")
    .addEventListener(
      "click",
      salvarMovimentacao
    );


  $("btnCancelar")
    .addEventListener(
      "click",
      fecharModalMovimentacao
    );


  $("btnFecharModal")
    .addEventListener(
      "click",
      fecharModalMovimentacao
    );


  $("btnFecharHistorico")
    .addEventListener(
      "click",
      fecharHistorico
    );


  $("modalMovimentacao")
    .addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          $("modalMovimentacao")
        ) {

          fecharModalMovimentacao();
        }
      }
    );


  $("modalHistorico")
    .addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          $("modalHistorico")
        ) {

          fecharHistorico();
        }
      }
    );


  document.addEventListener(
    "keydown",
    (event) => {

      if (event.key !== "Escape") {
        return;
      }

      fecharModalMovimentacao();
      fecharHistorico();
    }
  );


  // =====================================================
  // INICIALIZAÇÃO
  // =====================================================

  carregarEstoque();
</script>
